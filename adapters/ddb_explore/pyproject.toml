[project]
name = "harbor-ddb-explore-adapter"
version = "0.1.0"
description = "Evaluate DDB apps from prompt JSONL with the shared browser judge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["harbor"]

[project.scripts]
ddb-explore = "ddb_explore.main:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ddb_explore"

[tool.uv.sources]
harbor = { path = "../..", editable = true }
