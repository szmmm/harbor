job_name: ddb-explore-ddb
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
quiet: false

environment:
  type: docker
  force_build: true
  delete: true

agents:
  - name: ddb
    kwargs:
      training: true
    env:
      DDB_BASE_URL: ${DDB_BASE_URL}
      DDB_API_KEY: ${DDB_API_KEY}
      DDB_PREVIEW_BASE_URL: ${DDB_PREVIEW_BASE_URL:-}
      DDB_CALLBACK_URL: ${DDB_CALLBACK_URL:-}

verifier:
  env:
    VLM_REWARD_ENABLED: ${VLM_REWARD_ENABLED:-1}
    TRAJECTORY_REWARD_ENABLED: ${TRAJECTORY_REWARD_ENABLED:-1}
    DDB_TRAJECTORY_AGENT: ${DDB_TRAJECTORY_AGENT:-ddt-agent}
    TRAJECTORY_SCORE_TYPE: ${TRAJECTORY_SCORE_TYPE:-validation_rubric}
    VLM_API_KEY: ${VLM_API_KEY:-}
    VLM_API_BASE_URL: ${VLM_API_BASE_URL:-}
    VLM_MODEL: ${VLM_MODEL:-Qwen/Qwen2.5-VL-32B-Instruct}
    VLM_EXPLORE_ENABLED: ${VLM_EXPLORE_ENABLED:-1}
    VLM_EXPLORE_MAX_STEPS: ${VLM_EXPLORE_MAX_STEPS:-40}
    VLM_EXPLORE_DEADLINE_S: ${VLM_EXPLORE_DEADLINE_S:-1500}
    VLM_REQUEST_TIMEOUT_S: ${VLM_REQUEST_TIMEOUT_S:-120}
    VLM_RUBRIC_MIN_COVERAGE: ${VLM_RUBRIC_MIN_COVERAGE:-0.9}
    VLM_EXPLORE_DEVICE: ${VLM_EXPLORE_DEVICE:-}
    VLM_OMIT_TEMPERATURE: ${VLM_OMIT_TEMPERATURE:-1}

datasets:
  - path: datasets/ddb-explore
